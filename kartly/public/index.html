<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartly – Shop everything</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="top">
    <div class="bar">
      <a class="logo" href="#/">kartly</a>
      <form id="search" class="search" role="search">
        <select id="search-cat" aria-label="Category"><option value="">All</option></select>
        <input id="search-q" type="search" placeholder="Search products, brands…" aria-label="Search">
        <button type="submit" aria-label="Search">Search</button>
      </form>
      <nav class="acct" id="acct"></nav>
      <a class="cart-link" href="#/cart" aria-label="Cart">Cart <span id="cart-count" class="badge">0</span></a>
    </div>
    <nav class="cats" id="cats" aria-label="Categories"></nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer class="foot">
    <p>Kartly is a demo store. Payments are simulated and no real orders are placed.</p>
  </footer>
  <script src="/js/app.js"></script>
</body>
</html>
